<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nike</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
       if (sessionStorage.redirect) {
         const isGitHubPages = window.location.hostname.includes('github.io');
         const baseUrl = isGitHubPages ? `/${window.location.pathname.split('/')[1]}` : '';
         const redirect = sessionStorage.redirect;
         delete sessionStorage.redirect;
         if (redirect && redirect !== (baseUrl || '/') && redirect !== (baseUrl + '/')) {
           window.location.href = baseUrl + (redirect.startsWith(baseUrl) ? redirect.slice(baseUrl.length) : redirect);
         }
       }
    </script>
  </body>
</html>
